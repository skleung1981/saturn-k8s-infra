apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-postgres-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/saturn-backend/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-postgres-pv-claim
  namespace: saturn-backend
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: saturn-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 965
        runAsGroup: 5002
        fsGroup: 5002
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-user-pass
              key: password
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-user-pass
              key: username
        volumeMounts:
        - name: backend-postgres-persistent-storage
          mountPath: /var/lib/postgresql/18/docker
      volumes:
      - name: backend-postgres-persistent-storage
        persistentVolumeClaim:
          claimName: backend-postgres-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: saturn-backend
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
