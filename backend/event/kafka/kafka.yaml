apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-kafka-pv
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/saturn-backend/kafka
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-kafka-pv-claim
  namespace: saturn-backend
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    app: kafka
spec:
  volumeName: backend-kafka-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: saturn-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        runAsUser: 965
        runAsGroup: 5002
        fsGroup: 5002
      initContainers:
        - name: seed-config
          image: apache/kafka:4.4.0
          command: [ "sh", "-c", "cp -R /opt/kafka/config/. /config-seed/" ]
          volumeMounts:
            - name: kafka-config
              mountPath: /config-seed
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service.saturn-backend.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "72"
          volumeMounts:
            - name: backend-kafka-persistent-storage
              mountPath: /var/lib/kafka/data
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: kafka-logs
              mountPath: /opt/kafka/logs
      volumes:
        - name: backend-kafka-persistent-storage
          persistentVolumeClaim:
            claimName: backend-kafka-pv-claim
        - name: kafka-config
          emptyDir: { }
        - name: kafka-logs
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: saturn-backend
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      name: tcp
      port: 9092
      targetPort: 9092
