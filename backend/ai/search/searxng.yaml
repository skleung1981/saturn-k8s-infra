apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: saturn-backend
data:
  settings.yml: |
    use_default_settings: true
    server:      
      limiter: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: saturn-backend
spec:
  replicas: 1
  selector:
    matchLabels:
     app: searxng
  template:
    metadata:
      labels:
       app: searxng
    spec:
      securityContext:      
        runAsUser: 965
        runAsGroup: 5002
        fsGroup: 5002
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: saturn-backend
spec:
  selector: 
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080