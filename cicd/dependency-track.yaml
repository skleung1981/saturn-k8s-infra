apiVersion: v1
kind: PersistentVolume
metadata:
  name: dependency-track-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/saturn-cicd-sec/dependency-track
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-track-pv-claim
  namespace: saturn-cicd
  labels:
    app: dependency-track-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-api
  namespace: saturn-cicd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dependency-track-api
  template:
    metadata:
      labels:
        app: dependency-track-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 966
        runAsGroup: 5000
        fsGroup: 5000
      containers:
      - name: dependency-track-api
        image: dependencytrack/apiserver:5.0.4
        ports:
        - containerPort: 8080
          name: api
        env:
        - name: "DT_DATA_DIR"
          value: "/data"
        - name: "DT_METRICS_ENABLED"
          value: "true"
        - name: "DT_DATASOURCE_DEFAULT_URL"
          value: "jdbc:postgresql://postgres-service:5432/dependency_track"
        - name: "DT_DATASOURCE_DEFAULT_USERNAME"
          valueFrom:
            secretKeyRef:
              name: postgres-user-pass
              key: username
        - name: "DT_DATASOURCE_DEFAULT_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: postgres-user-pass
              key: password
        volumeMounts:
        - name: dependency-track-persistent-storage
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: dependency-track-persistent-storage
        persistentVolumeClaim:
          claimName: dependency-track-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-track-api-service
  namespace: saturn-cicd
spec:
  selector:
    app: dependency-track-api
  ports:
  - port: 8080
    targetPort: 8080
    name: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dependency-track-api-ingress
  namespace: saturn-cicd
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Api-Key"    
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /cicd/dependency-track-api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: dependency-track-api-service
            port:
              number: 8080