apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: saturn-gitops
spec:
  project: default
  source:
    repoURL: http://forgejo-service.saturn-cicd.svc.cluster.local:3000/myskl/saturn-k8s-infra.git
    targetRevision: main
    path: gitops/platforms
  destination:
    server: https://kubernetes.default.svc
    namespace: saturn-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true